### GENERAL ###

# Update 'control key' to <Ctrl-a> since it is easier to reach
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Command delay? No thank you, shorten it here
set -sg escape-time 1


### KEY BINDINGS ###

# Allow us to relaod our tmux configuration while using tmux
bind r source-file ~/.tmux.conf \; display-message "tmux.conf Reloaded!"

# Use the vertical and horizontal symbols to split the screen and use current directory
bind L split-window -h -c "#{pane_current_path}"
bind J split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Smart pane switching with awareness of vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n "C-\\" if-shell "$is_vim" "send-keys C-\\\\"  "select-pane -l"
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# Alternative tmux pane movement shortcuts using hjkl (ignores vim splits)
bind k select-pane -U
bind h select-pane -L
bind j select-pane -D
bind l select-pane -R

# Because l was remapped for navigation need to replace overwritten bindings
bind "'" last-window  # new binding for toggle window

# Pane resizing
bind -r + resize-pane -U
bind -r - resize-pane -D
bind -r < resize-pane -L
bind -r > resize-pane -R
bind -r Up resize-pane -U 10
bind -r Down resize-pane -D 10
bind -r Left resize-pane -L 10
bind -r Right resize-pane -R 10

# Use w to close window
bind w confirm-before -p "kill-window #W? (y/n)" kill-window

# Use b to go to previous window (since p is used for paste in copy mode)
bind b previous-window


### COPY MODE: vim ###

setw -g mode-keys vi                                    # set vi mode for copy-mode
bind -T copy-mode-vi Escape send-keys -X cancel         # use esc to exit copy-mode
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle  # begin rectangle selection C-v
bind -T copy-mode-vi v send-keys -X begin-selection     # begin selection with v
bind -T copy-mode-vi V send-keys -X select-line         # begin line selection with V
bind -T copy-mode-vi y send-keys -X copy-selection      # yank text
unbind p                                                # unbind so we can paste using p
bind p paste-buffer                                     # paste using p


### THEME / COLOURS ###

tm_color_active=magenta
tm_color_inactive=colour243 # grey
tm_color_feature=cyan

# Default status bar colors
set-option -g status-style fg=$tm_color_active,bg=default

# Default window title colors
set-option -g window-status-style fg=$tm_color_inactive,bg=default
set-option -g window-status-format "#I #W"

# Active window title colors
set-option -g window-status-current-style fg=$tm_color_active,bg=default
set-option -g window-status-current-format "#[bold]#I #W"

# Pane border
set-option -g pane-active-border-style fg=$tm_color_feature,bg=$tm_color_feature

# Set pane colors
#bind select-pane -t:.1 -P 'fg=blue,bg=red'
#select-pane -P 'bg=red'
#set-option -g pane-active-border-style fg=$tm_color_feature,bg=$tm_color_feature
bind C-0 select-pane -P fg=$tm_color_feature,bg=$tm_color_feature
bind C-1 select-pane -P 'fg=blue,bg=red'
bind S-1 select-pane -P 'fg=blue,bg=red'


### PLUGINS ###

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# recover tmux session with resurrect / continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-strategy-nvim 'session'

# tmux automatic restart after computer/server is turned on
set -g @continuum-boot 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
